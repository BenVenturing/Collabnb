<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Local Chat</title>
  <style>
    :root {
      --bg-dark: #0f111a;
      --panel-dark: #161925;
      --border-color: #24293e;
      --accent: #a370f7;
      --accent-gradient: linear-gradient(135deg, #a370f7 0%, #6366f1 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dark: #111827;
      --bubble-user: #7c3aed;
      --bubble-bot: #1f2937;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Layout */
    .sidebar {
      width: 280px;
      background-color: var(--panel-dark);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
    }

    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-dark);
      position: relative;
    }

    /* Sidebar Content */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 18px;
      box-shadow: 0 0 15px rgba(163, 112, 247, 0.4);
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .config-card {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    select, input {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    .btn-refresh {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-refresh:hover {
      background: rgba(163, 112, 247, 0.1);
    }

    /* Chat Area */
    .chat-header {
      height: 70px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      background-color: rgba(22, 25, 37, 0.5);
      backdrop-filter: blur(10px);
    }

    .active-model-info {
      display: flex;
      flex-direction: column;
    }

    .active-model-name {
      font-weight: 600;
      font-size: 16px;
    }

    .connection-status {
      font-size: 12px;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .connection-status.offline {
      color: #ef4444;
    }

    .connection-status::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: currentColor;
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      max-width: 80%;
      flex-direction: column;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .message-bubble {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.user .message-bubble {
      background: var(--accent-gradient);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.2);
    }

    .message.assistant .message-bubble {
      background-color: var(--bubble-bot);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .message-info {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      margin-left: 4px;
    }

    .message.user .message-info {
      align-self: flex-end;
      margin-right: 4px;
    }

    /* Input Box Area */
    .input-container {
      padding: 20px 30px 30px;
      background-color: var(--bg-dark);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background-color: var(--panel-dark);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 8px 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      resize: none;
      font-family: var(--font-family);
      font-size: 15px;
      padding: 8px 0;
      outline: none;
      max-height: 200px;
      height: 40px;
    }

    .btn-send {
      background: var(--accent-gradient);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-left: 12px;
    }

    .btn-send:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(163, 112, 247, 0.5);
    }

    .btn-send:disabled {
      background: var(--border-color);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Formatting in chat */
    pre {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    code {
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 2px 4px;
      border-radius: 4px;
    }

    pre code {
      background-color: transparent;
      padding: 0;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--text-muted);
      gap: 15px;
      text-align: center;
      padding: 40px;
    }

    .empty-state-icon {
      font-size: 64px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .empty-state h3 {
      color: var(--text-main);
      font-size: 20px;
    }

    /* Loading Indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 20px;
      padding: 0 4px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo-container">
      <div class="logo-icon">🦙</div>
      <div class="logo-text">LocalChat</div>
    </div>

    <div>
      <div class="section-title">Configuration</div>
      <div class="config-card">
        <div class="form-group">
          <label for="ollama-url">Ollama Server URL</label>
          <input type="text" id="ollama-url" value="http://localhost:11434">
        </div>
        <div class="form-group">
          <label for="model-select">Active Model</label>
          <select id="model-select">
            <option value="">Loading models...</option>
          </select>
        </div>
        <button class="btn-refresh" id="btn-refresh">
          🔄 Refresh Models
        </button>
      </div>
    </div>

    <div>
      <div class="section-title">System Prompt</div>
      <textarea id="system-prompt" style="width: 100%; height: 100px; background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); padding: 8px; font-size: 13px; outline: none; resize: none;" placeholder="You are a helpful local assistant."></textarea>
    </div>
  </div>

  <!-- Main Area -->
  <div class="main-chat">
    <div class="chat-header">
      <div class="active-model-info">
        <div class="active-model-name" id="header-model-name">Ollama</div>
        <div class="connection-status" id="status-indicator">Connected</div>
      </div>
      <button class="btn-refresh" id="btn-clear" style="border-color: #ef4444; color: #ef4444;">
        🗑️ Clear Chat
      </button>
    </div>

    <!-- Messages -->
    <div class="messages-container" id="messages-container">
      <div class="empty-state" id="empty-state">
        <div class="empty-state-icon">💬</div>
        <h3>Start a local session</h3>
        <p>Choose a model on the left, type a message, and converse offline.</p>
      </div>
    </div>

    <!-- Loading dot indicator (hidden by default) -->
    <div style="padding: 0 30px; display: none;" id="typing-container">
      <div class="message assistant">
        <div class="message-bubble" style="padding: 10px 15px;">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Box -->
    <div class="input-container">
      <div class="input-wrapper">
        <textarea id="chat-input" placeholder="Type a message..." rows="1"></textarea>
        <button class="btn-send" id="btn-send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const ollamaUrlInput = document.getElementById('ollama-url');
    const modelSelect = document.getElementById('model-select');
    const btnRefresh = document.getElementById('btn-refresh');
    const btnClear = document.getElementById('btn-clear');
    const btnSend = document.getElementById('btn-send');
    const chatInput = document.getElementById('chat-input');
    const messagesContainer = document.getElementById('messages-container');
    const emptyState = document.getElementById('empty-state');
    const typingContainer = document.getElementById('typing-container');
    const headerModelName = document.getElementById('header-model-name');
    const statusIndicator = document.getElementById('status-indicator');
    const systemPromptInput = document.getElementById('system-prompt');

    let chatHistory = [];

    // Auto-resize input textarea
    chatInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight - 16) + 'px';
    });

    // Check Ollama connection and populate models list
    async function refreshModels() {
      const baseUrl = ollamaUrlInput.value.trim();
      try {
        statusIndicator.innerText = "Connecting...";
        statusIndicator.className = "connection-status";

        const response = await fetch(`${baseUrl}/api/tags`);
        if (!response.ok) throw new Error('Network response not ok');
        
        const data = await response.json();
        modelSelect.innerHTML = '';
        
        if (data.models && data.models.length > 0) {
          data.models.forEach(model => {
            const opt = document.createElement('option');
            opt.value = model.name;
            opt.innerText = model.name;
            modelSelect.appendChild(opt);
          });
          statusIndicator.innerText = "Connected";
          statusIndicator.className = "connection-status";
          updateHeaderName();
        } else {
          const opt = document.createElement('option');
          opt.value = "";
          opt.innerText = "No models found (pull one first)";
          modelSelect.appendChild(opt);
          statusIndicator.innerText = "No Models";
          statusIndicator.className = "connection-status offline";
        }
      } catch (err) {
        console.error(err);
        modelSelect.innerHTML = '<option value="">Failed to connect</option>';
        statusIndicator.innerText = "Offline / Connection Failed";
        statusIndicator.className = "connection-status offline";
      }
    }

    function updateHeaderName() {
      headerModelName.innerText = modelSelect.value || "Ollama";
    }

    modelSelect.addEventListener('change', updateHeaderName);
    btnRefresh.addEventListener('click', refreshModels);
    
    // Clear chat
    btnClear.addEventListener('click', () => {
      chatHistory = [];
      messagesContainer.innerHTML = '';
      messagesContainer.appendChild(emptyState);
      emptyState.style.display = 'flex';
    });

    // Send Message
    async function sendMessage() {
      const text = chatInput.value.trim();
      const model = modelSelect.value;
      const baseUrl = ollamaUrlInput.value.trim();
      const systemPrompt = systemPromptInput.value.trim();

      if (!text || !model) return;

      // Hide empty state
      emptyState.style.display = 'none';

      // Append User message
      appendMessage('user', text);
      chatInput.value = '';
      chatInput.style.height = '40px';

      // Build chat prompt sequence
      const messages = [];
      if (systemPrompt) {
        messages.push({ role: 'system', content: systemPrompt });
      }
      
      // Append historical messages
      chatHistory.forEach(msg => messages.push({ role: msg.role, content: msg.content }));
      
      // Append current user message
      messages.push({ role: 'user', content: text });

      // Save user message in history
      chatHistory.push({ role: 'user', content: text });

      // Show typing indicator
      typingContainer.style.display = 'block';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      // Prepare bot bubble placeholder
      const botMessageEl = appendMessagePlaceholder('assistant');
      const bubbleEl = botMessageEl.querySelector('.message-bubble');

      try {
        const response = await fetch(`${baseUrl}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: model,
            messages: messages,
            stream: true
          })
        });

        if (!response.ok) throw new Error('Failed to start chat streaming');

        // Hide typing indicator once response stream begins
        typingContainer.style.display = 'none';

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let assistantResponse = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          // NDJSON handling
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const json = JSON.parse(line);
              if (json.message && json.message.content) {
                assistantResponse += json.message.content;
                // Render content in bubble (with basic code block support)
                bubbleEl.innerHTML = formatMarkdown(assistantResponse);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
              }
            } catch (e) {
              console.warn("NDJSON parse error line: ", line);
            }
          }
        }

        // Add assistant response to history
        chatHistory.push({ role: 'assistant', content: assistantResponse });

      } catch (err) {
        console.error(err);
        typingContainer.style.display = 'none';
        bubbleEl.innerHTML = `<span style="color:#ef4444;">Error: Failed to stream response. Make sure Ollama is serving on the correct URL and the model is pulled.</span>`;
      }
    }

    function appendMessage(role, content) {
      const messageEl = document.createElement('div');
      messageEl.className = `message ${role}`;
      
      const bubbleEl = document.createElement('div');
      bubbleEl.className = 'message-bubble';
      bubbleEl.innerHTML = formatMarkdown(content);

      const infoEl = document.createElement('div');
      infoEl.className = 'message-info';
      infoEl.innerText = role === 'user' ? 'You' : (modelSelect.value || 'Assistant');

      messageEl.appendChild(bubbleEl);
      messageEl.appendChild(infoEl);
      messagesContainer.appendChild(messageEl);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return messageEl;
    }

    function appendMessagePlaceholder(role) {
      const messageEl = document.createElement('div');
      messageEl.className = `message ${role}`;
      
      const bubbleEl = document.createElement('div');
      bubbleEl.className = 'message-bubble';
      bubbleEl.innerHTML = '';

      const infoEl = document.createElement('div');
      infoEl.className = 'message-info';
      infoEl.innerText = modelSelect.value || 'Assistant';

      messageEl.appendChild(bubbleEl);
      messageEl.appendChild(infoEl);
      messagesContainer.appendChild(messageEl);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return messageEl;
    }

    // Simple markdown code blocks helper (replaces standard markdown styles for local offline rendering without full library)
    function formatMarkdown(text) {
      // Escape HTML
      let html = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Code blocks ```code```
      html = html.replace(/```([\s\S]*?)```/g, (match, p1) => {
        return `<pre><code>${p1.trim()}</code></pre>`;
      });

      // Inline code `code`
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Paragraphs/Newlines
      html = html.replace(/\n/g, '<br>');

      return html;
    }

    // Key handlers
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    btnSend.addEventListener('click', sendMessage);

    // Initial load
    refreshModels();
  </script>
</body>
</html>
