name: Weekly cleanup audit

on:
  schedule:
    - cron: '0 9 * * 1' # every Monday 9am UTC
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Run marketing site asset audit
        run: node scripts/audit-marketing-assets.mjs > marketing-report.txt 2>&1 || true

      - name: Run knip on the app
        working-directory: app
        run: |
          npm ci
          npx knip --no-exit-code > ../knip-report.txt 2>&1 || true

      - name: Open or update report issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MAX = 55000;
            function readCapped(path) {
              let text = fs.readFileSync(path, 'utf8').trim();
              if (text.length > MAX) text = text.slice(0, MAX) + '\n\n... (truncated, see full run log in Actions)';
              return text;
            }

            const knipReport = readCapped('knip-report.txt');
            const marketingReport = readCapped('marketing-report.txt');

            const title = '🧹 Weekly cleanup report';
            const body = [
              '**Nothing here is deleted automatically.** Review each item before removing it —',
              'static analysis can misflag anything reached via dynamic import, a string-built path,',
              'or usage outside the scanned directory (e.g. Convex functions called by name).',
              '',
              '## App (`app/src`) — knip',
              'Unused files, exports, and dependencies.',
              '```',
              knipReport,
              '```',
              '',
              '## Marketing site (repo root) — orphaned assets & pages',
              'Static multi-page HTML, not a module graph, so this is a custom scan rather than knip.',
              '```',
              marketingReport,
              '```',
              '',
              `_Last updated: ${new Date().toISOString()}_`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((i) => !i.pull_request && i.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
