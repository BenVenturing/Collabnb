<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signing in… — Collabnb</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F7F5F2; font-family:'Satoshi',sans-serif; }
  .wrap { text-align:center; }
  .spinner { width:36px; height:36px; border:3px solid #D1EBDB; border-top-color:#3C5759; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 1rem; }
  @keyframes spin { to { transform:rotate(360deg); } }
  p { color:#3C5759; font-size:0.95rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="spinner"></div>
  <p>Completing sign in…</p>
</div>
<script type="module">
  import { Clerk } from '@clerk/clerk-js';
  const key = import.meta.env.VITE_CLERK_PUBLISHABLE_KEY;
  if (!key) { window.location.href = '/login.html'; }
  const clerk = new Clerk(key);
  await clerk.load();
  try {
    await clerk.handleRedirectCallback({
      afterSignInUrl: '/app/#/explore',
      afterSignUpUrl: '/app/#/explore',
    });
  } catch {
    window.location.href = '/login.html';
  }
</script>
</body>
</html>
