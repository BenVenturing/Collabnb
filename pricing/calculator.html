<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collab cost calculator — Collabnb</title>
  <meta name="description" content="Estimate the value of a Collabnb collaboration. Beta." />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@400,500,700,800&f[]=fraunces@400,600,700,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="lg-distortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.008" numOctaves="2" seed="8" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="softNoise" />
        <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="28" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
  <div aria-hidden="true" class="bg-layers bg-base"></div>
  <div aria-hidden="true" class="bg-layers bg-gradient"></div>
  <div aria-hidden="true" class="bg-layers bg-clouds"></div>
  <div aria-hidden="true" class="bg-grain"></div>
  <div id="root"></div>
  <script type="module" src="./calculator.jsx"></script>
  <script src="/collabnb-analytics.js" defer></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
