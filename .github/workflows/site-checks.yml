name: Site checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix app
      - name: Accessibility behavior, production builds, and local links
        run: npm run check
