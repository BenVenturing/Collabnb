<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signing in… — Collabnb</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css" />
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Satoshi',sans-serif; }
  .wrap { text-align:center; position:relative; z-index:1; }
  .spinner { width:36px; height:36px; border:3px solid #D1EBDB; border-top-color:#3C5759; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 1rem; }
  @keyframes spin { to { transform:rotate(360deg); } }
  p { color:#3C5759; font-size:0.95rem; }
</style>
</head>
<body>
<div aria-hidden="true" class="bg-layers bg-base"></div>
<div aria-hidden="true" class="bg-layers bg-gradient"></div>
<div aria-hidden="true" class="bg-layers bg-clouds"></div>
<div aria-hidden="true" class="bg-grain"></div>
<div class="wrap">
  <div class="spinner"></div>
  <p>Completing sign in…</p>
</div>
<script type="module">
  import { Clerk } from '@clerk/clerk-js';
  const key = import.meta.env.VITE_CLERK_PUBLISHABLE_KEY;
  const adminEmail = import.meta.env.VITE_ADMIN_EMAIL;
  if (!key) { window.location.href = '/login.html'; }
  const clerk = new Clerk(key);
  await clerk.load();
  try {
    // handleRedirectCallback completes the OAuth flow and sets the active session
    await clerk.handleRedirectCallback();
    // After callback, route based on context
    const email = clerk.user?.primaryEmailAddress?.emailAddress || '';
    const isAdmin = adminEmail && email && email.toLowerCase() === adminEmail.toLowerCase();
    const isNewSignup = localStorage.getItem('collabnb_new_signup') === '1'
      || localStorage.getItem('collabnb_signup_started') === '1';
    // Clear flags
    localStorage.removeItem('collabnb_signup_started');
    if (isAdmin) {
      window.location.href = '/admin';
    } else if (isNewSignup) {
      // Keep collabnb_new_signup set so the React app can show the celebration
      window.location.href = '/profile';
    } else {
      window.location.href = '/explore';
    }
  } catch {
    window.location.href = '/login.html';
  }
</script>
</body>
</html>
