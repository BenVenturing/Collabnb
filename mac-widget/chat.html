<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Mac Widget</title>
  <style>
    :root {
      --bg-dark: #0d0f16;
      --panel-dark: #141722;
      --border-color: #202433;
      --accent: #a370f7;
      --accent-gradient: linear-gradient(135deg, #a370f7 0%, #6366f1 100%);
      --text-main: #f3f4f6;
      --text-muted: #8e95a5;
      --bubble-user: #7c3aed;
      --bubble-bot: #1a1d29;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: transparent;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Container for menu bar app styling (rounded corners, shadow) */
    .widget-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Header */
    .chat-header {
      height: 60px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background-color: rgba(20, 23, 34, 0.8);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 26px;
      height: 26px;
      background: var(--accent-gradient);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(163, 112, 247, 0.4);
    }

    .model-selector-wrapper {
      max-width: 160px;
    }

    select {
      background-color: transparent;
      border: none;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      width: 100%;
      text-overflow: ellipsis;
    }

    select option {
      background-color: var(--panel-dark);
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .icon-btn.active {
      background-color: rgba(163, 112, 247, 0.15);
      color: var(--accent);
    }

    /* Settings Overlay */
    .settings-overlay {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(13, 15, 22, 0.95);
      backdrop-filter: blur(8px);
      z-index: 5;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform: translateY(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .settings-overlay.open {
      transform: translateY(0);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea {
      background-color: var(--panel-dark);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    .btn-save-settings {
      background: var(--accent-gradient);
      border: none;
      color: white;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
    }

    /* Messages List */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      max-width: 85%;
      flex-direction: column;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.user .message-bubble {
      background: var(--accent-gradient);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.15);
    }

    .message.assistant .message-bubble {
      background-color: var(--bubble-bot);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .message-info {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
      margin-left: 4px;
    }

    .message.user .message-info {
      align-self: flex-end;
      margin-right: 4px;
    }

    /* Input Area */
    .input-container {
      padding: 12px 16px 16px;
      background-color: var(--bg-dark);
      border-top: 1px solid var(--border-color);
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background-color: var(--panel-dark);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 6px 12px;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
    }

    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      resize: none;
      font-family: var(--font-family);
      font-size: 14px;
      padding: 8px 0;
      outline: none;
      max-height: 120px;
      height: 36px;
    }

    .btn-send {
      background: var(--accent-gradient);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
      margin-left: 8px;
    }

    .btn-send:hover {
      transform: scale(1.05);
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--text-muted);
      gap: 10px;
      text-align: center;
      padding: 20px;
    }

    .empty-state-icon {
      font-size: 40px;
    }

    .empty-state h3 {
      color: var(--text-main);
      font-size: 16px;
    }

    .empty-state p {
      font-size: 13px;
    }

    /* Loading Indicator */
    .typing-indicator {
      display: flex;
      gap: 3px;
      align-items: center;
      height: 16px;
    }

    .typing-dot {
      width: 5px;
      height: 5px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    pre {
      background-color: rgba(0, 0, 0, 0.4);
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 12px;
    }

    code {
      font-family: monospace;
      font-size: 13px;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 2px 4px;
      border-radius: 4px;
    }

    pre code {
      background-color: transparent;
      padding: 0;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-left">
        <div class="logo-icon">🦙</div>
        <div class="model-selector-wrapper">
          <select id="model-select">
            <option value="">Loading models...</option>
          </select>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="btn-clear" title="Clear Chat">
          🗑️
        </button>
        <button class="icon-btn" id="btn-settings" title="Settings">
          ⚙️
        </button>
      </div>
    </div>

    <!-- Settings Overlay -->
    <div class="settings-overlay" id="settings-overlay">
      <div class="form-group">
        <label for="ollama-url">Ollama Server URL</label>
        <input type="text" id="ollama-url" value="http://localhost:11434">
      </div>
      <div class="form-group">
        <label for="system-prompt">System Prompt</label>
        <textarea id="system-prompt" style="height: 120px;" placeholder="You are a helpful local assistant."></textarea>
      </div>
      <button class="btn-save-settings" id="btn-save-settings">
        Save & Close
      </button>
    </div>

    <!-- Messages Container -->
    <div class="messages-container" id="messages-container">
      <div class="empty-state" id="empty-state">
        <div class="empty-state-icon">⚡</div>
        <h3>Gemma 4 Widget</h3>
        <p>Type a message to start chatting offline.</p>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div style="padding: 0 16px; display: none;" id="typing-container">
      <div class="message assistant">
        <div class="message-bubble" style="padding: 8px 12px;">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-container">
      <div class="input-wrapper">
        <textarea id="chat-input" placeholder="Type a message..." rows="1"></textarea>
        <button class="btn-send" id="btn-send">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const ollamaUrlInput = document.getElementById('ollama-url');
    const modelSelect = document.getElementById('model-select');
    const btnSettings = document.getElementById('btn-settings');
    const btnSaveSettings = document.getElementById('btn-save-settings');
    const settingsOverlay = document.getElementById('settings-overlay');
    const btnClear = document.getElementById('btn-clear');
    const btnSend = document.getElementById('btn-send');
    const chatInput = document.getElementById('chat-input');
    const messagesContainer = document.getElementById('messages-container');
    const emptyState = document.getElementById('empty-state');
    const typingContainer = document.getElementById('typing-container');
    const systemPromptInput = document.getElementById('system-prompt');

    let chatHistory = [];

    // Load saved settings from localStorage
    if (localStorage.getItem('ollama_url')) {
      ollamaUrlInput.value = localStorage.getItem('ollama_url');
    }
    if (localStorage.getItem('system_prompt')) {
      systemPromptInput.value = localStorage.getItem('system_prompt');
    }

    // Toggle Settings Overlay
    btnSettings.addEventListener('click', () => {
      btnSettings.classList.toggle('active');
      settingsOverlay.classList.toggle('open');
    });

    btnSaveSettings.addEventListener('click', () => {
      localStorage.setItem('ollama_url', ollamaUrlInput.value.trim());
      localStorage.setItem('system_prompt', systemPromptInput.value.trim());
      btnSettings.classList.remove('active');
      settingsOverlay.classList.remove('open');
      refreshModels();
    });

    // Auto-resize textarea
    chatInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight - 16) + 'px';
    });

    // Fetch Ollama models
    async function refreshModels() {
      const baseUrl = ollamaUrlInput.value.trim();
      try {
        const response = await fetch(`${baseUrl}/api/tags`);
        if (!response.ok) throw new Error('Network response not ok');
        
        const data = await response.json();
        const currentVal = modelSelect.value;
        modelSelect.innerHTML = '';
        
        if (data.models && data.models.length > 0) {
          data.models.forEach(model => {
            const opt = document.createElement('option');
            opt.value = model.name;
            opt.innerText = model.name;
            modelSelect.appendChild(opt);
          });
          
          // Restore selected value if still exists, or default to gemma4
          if (currentVal && data.models.some(m => m.name === currentVal)) {
            modelSelect.value = currentVal;
          } else {
            // Find gemma4 if present
            const gemma4 = data.models.find(m => m.name.toLowerCase().includes('gemma4'));
            if (gemma4) {
              modelSelect.value = gemma4.name;
            }
          }
        } else {
          modelSelect.innerHTML = '<option value="">No models (pull one)</option>';
        }
      } catch (err) {
        console.error(err);
        modelSelect.innerHTML = '<option value="">Ollama Offline</option>';
      }
    }

    // Clear chat
    btnClear.addEventListener('click', () => {
      chatHistory = [];
      messagesContainer.innerHTML = '';
      messagesContainer.appendChild(emptyState);
      emptyState.style.display = 'flex';
    });

    // Send Message
    async function sendMessage() {
      const text = chatInput.value.trim();
      const model = modelSelect.value;
      const baseUrl = ollamaUrlInput.value.trim();
      const systemPrompt = systemPromptInput.value.trim();

      if (!text || !model) return;

      emptyState.style.display = 'none';
      appendMessage('user', text);
      chatInput.value = '';
      chatInput.style.height = '36px';

      const messages = [];
      if (systemPrompt) {
        messages.push({ role: 'system', content: systemPrompt });
      }
      chatHistory.forEach(msg => messages.push({ role: msg.role, content: msg.content }));
      messages.push({ role: 'user', content: text });
      chatHistory.push({ role: 'user', content: text });

      typingContainer.style.display = 'block';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      const botMessageEl = appendMessagePlaceholder('assistant');
      const bubbleEl = botMessageEl.querySelector('.message-bubble');

      try {
        const response = await fetch(`${baseUrl}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: model,
            messages: messages,
            stream: true
          })
        });

        if (!response.ok) throw new Error('Streaming failed');
        typingContainer.style.display = 'none';

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let assistantResponse = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const json = JSON.parse(line);
              if (json.message && json.message.content) {
                assistantResponse += json.message.content;
                bubbleEl.innerHTML = formatMarkdown(assistantResponse);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
              }
            } catch (e) {}
          }
        }

        chatHistory.push({ role: 'assistant', content: assistantResponse });

      } catch (err) {
        console.error(err);
        typingContainer.style.display = 'none';
        bubbleEl.innerHTML = `<span style="color:#ef4444;">Error streaming from Ollama. Make sure Ollama is running offline.</span>`;
      }
    }

    function appendMessage(role, content) {
      const messageEl = document.createElement('div');
      messageEl.className = `message ${role}`;
      
      const bubbleEl = document.createElement('div');
      bubbleEl.className = 'message-bubble';
      bubbleEl.innerHTML = formatMarkdown(content);

      const infoEl = document.createElement('div');
      infoEl.className = 'message-info';
      infoEl.innerText = role === 'user' ? 'You' : (modelSelect.value ? modelSelect.value.split(':')[0] : 'Gemma');

      messageEl.appendChild(bubbleEl);
      messageEl.appendChild(infoEl);
      messagesContainer.appendChild(messageEl);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return messageEl;
    }

    function appendMessagePlaceholder(role) {
      const messageEl = document.createElement('div');
      messageEl.className = `message ${role}`;
      
      const bubbleEl = document.createElement('div');
      bubbleEl.className = 'message-bubble';
      bubbleEl.innerHTML = '';

      const infoEl = document.createElement('div');
      infoEl.className = 'message-info';
      infoEl.innerText = modelSelect.value ? modelSelect.value.split(':')[0] : 'Gemma';

      messageEl.appendChild(bubbleEl);
      messageEl.appendChild(infoEl);
      messagesContainer.appendChild(messageEl);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return messageEl;
    }

    function formatMarkdown(text) {
      let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      html = html.replace(/```([\s\S]*?)```/g, (match, p1) => `<pre><code>${p1.trim()}</code></pre>`);
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    btnSend.addEventListener('click', sendMessage);
    refreshModels();
  </script>
</body>
</html>
